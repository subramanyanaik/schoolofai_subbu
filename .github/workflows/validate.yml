name: validate

# Session 5 proves the PLAN is internally consistent.
# Session 6 proves the SYSTEM that executes it actually works: it regenerates
# the whole evidence bundle from scratch, on a clean checkout, on CPU.

on: [push, pull_request]

jobs:
  session5-plan:
    name: Session 5 - plan consistency (49 assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run plan and assert consistency
        working-directory: assignment5/src
        run: python3 -m erav5.run_plan
      - name: Export JSON
        working-directory: assignment5/src
        run: python3 -m erav5.export > /dev/null

  session6-execution:
    name: Session 6 - regenerate evidence and run invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install torch (CPU)
        run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      # The frozen inputs are committed. If either can be rebuilt to a
      # different hash, the "frozen" claim is false and everything downstream
      # that binds to those hashes is unverifiable -- so check it here.
      - name: Frozen inputs are reproducible
        working-directory: assignment6
        run: |
          cp tokenizer/tokenizer.json /tmp/tokenizer.committed.json
          cp corpus/documents.jsonl /tmp/documents.committed.jsonl
          python3 tools/build_corpus.py
          python3 tools/build_tokenizer.py
          diff -q /tmp/documents.committed.jsonl corpus/documents.jsonl
          diff -q /tmp/tokenizer.committed.json tokenizer/tokenizer.json

      # The graded command, run exactly as a grader would run it. It exits
      # non-zero if any of the 11 requirements fails or any check emits [FAIL].
      - name: Run the full demonstration
        working-directory: assignment6
        run: python3 run_demo.py

      - name: Invariant tests (unit + end-to-end over the generated bundle)
        working-directory: assignment6
        run: python3 -m unittest discover -s tests -v

      # Belt and braces: assert the bundle a grader reads actually says PASS,
      # independently of run_demo.py's own exit code.
      - name: Assert the evidence bundle reports 11/11
        working-directory: assignment6
        run: |
          python3 - <<'PY'
          import json, sys
          b = json.load(open("submission_artifacts/evidence.json", encoding="utf-8"))
          s = b["summary"]
          print(f"{s['passed']}/{s['total']} requirements pass")
          for r in b["requirements"]:
              print(f"  {r['result']:4}  {r['key']}")
          sys.exit(0 if s["all_passed"] else 1)
          PY
          grep -q "\[FAIL\]" submission_artifacts/run.log && exit 1 || exit 0

      - name: Upload the generated bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-artifacts
          path: assignment6/submission_artifacts/

  session7-kronecker-v2:
    name: Session 7 - Kronecker V2 exactness gates (CPU only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install (CPU torch)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy tiktoken pytest matplotlib

      # E2 lives here: logits, the log-partition function AND gradients must
      # match the naive dense head to <1e-10 in fp64.  This is arithmetic, not
      # measurement -- it must hold on any machine, GPU or not.
      - name: Test suite (88 tests)
        working-directory: assignment7
        run: python -m pytest tests/ -q

      # The property Problem 5 asks for, shown directly.
      - name: Reverse-determinism demo
        working-directory: assignment7
        run: python experiments/demo_invert.py

      # Re-derives the invertibility gates from scratch: 100% of the 50,257
      # GPT-2 tokens, 256,000 random byte strings, multi-script UTF-8.
      # Exits non-zero if any gate fails.
      - name: E1 invertibility gates
        working-directory: assignment7
        run: python experiments/e1_invertibility.py

      # The number this whole project is about: the head's parameter count
      # must not move when |V| does.
      - name: Parameter audit
        working-directory: assignment7
        run: python experiments/params_audit.py

      # Belt and braces: assert the committed evidence a grader reads actually
      # says PASS, independently of the scripts that produced it.
      - name: Assert committed gates report PASS
        working-directory: assignment7
        run: python experiments/verify_gates.py

  session8-timeline:
    name: Session 8 - timeline integrity and date discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every date must carry a source link, the list must stay in
      # chronological order (the timeline's entire claim), and nothing may be
      # written up with fewer than three honest downsides.
      - name: Validate the mechanism dataset
        run: python assignment8/tools/validate.py

      # DATES.md is generated from data.js. If regenerating it produces a diff,
      # the README table and the live site have drifted apart.
      - name: DATES.md is in sync with data.js
        run: |
          python assignment8/tools/gen_date_table.py
          git diff --exit-code -- assignment8/DATES.md
