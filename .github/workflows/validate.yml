name: validate

# Session 5 proves the PLAN is internally consistent.
# Session 6 proves the SYSTEM that executes it actually works: it regenerates
# the whole evidence bundle from scratch, on a clean checkout, on CPU.

on: [push, pull_request]

jobs:
  session5-plan:
    name: Session 5 - plan consistency (49 assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run plan and assert consistency
        working-directory: assignment5/src
        run: python3 -m erav5.run_plan
      - name: Export JSON
        working-directory: assignment5/src
        run: python3 -m erav5.export > /dev/null

  session6-execution:
    name: Session 6 - regenerate evidence and run invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install torch (CPU)
        run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      # The frozen inputs are committed. If either can be rebuilt to a
      # different hash, the "frozen" claim is false and everything downstream
      # that binds to those hashes is unverifiable -- so check it here.
      - name: Frozen inputs are reproducible
        working-directory: assignment6
        run: |
          cp tokenizer/tokenizer.json /tmp/tokenizer.committed.json
          cp corpus/documents.jsonl /tmp/documents.committed.jsonl
          python3 tools/build_corpus.py
          python3 tools/build_tokenizer.py
          diff -q /tmp/documents.committed.jsonl corpus/documents.jsonl
          diff -q /tmp/tokenizer.committed.json tokenizer/tokenizer.json

      # The graded command, run exactly as a grader would run it. It exits
      # non-zero if any of the 11 requirements fails or any check emits [FAIL].
      - name: Run the full demonstration
        working-directory: assignment6
        run: python3 run_demo.py

      - name: Invariant tests (unit + end-to-end over the generated bundle)
        working-directory: assignment6
        run: python3 -m unittest discover -s tests -v

      # Belt and braces: assert the bundle a grader reads actually says PASS,
      # independently of run_demo.py's own exit code.
      - name: Assert the evidence bundle reports 11/11
        working-directory: assignment6
        run: |
          python3 - <<'PY'
          import json, sys
          b = json.load(open("submission_artifacts/evidence.json", encoding="utf-8"))
          s = b["summary"]
          print(f"{s['passed']}/{s['total']} requirements pass")
          for r in b["requirements"]:
              print(f"  {r['result']:4}  {r['key']}")
          sys.exit(0 if s["all_passed"] else 1)
          PY
          grep -q "\[FAIL\]" submission_artifacts/run.log && exit 1 || exit 0

      - name: Upload the generated bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-artifacts
          path: assignment6/submission_artifacts/

  session7-kronecker-v2:
    name: Session 7 - Kronecker V2 exactness gates (CPU only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install (CPU torch)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy tiktoken pytest matplotlib

      # E2 lives here: logits, the log-partition function AND gradients must
      # match the naive dense head to <1e-10 in fp64.  This is arithmetic, not
      # measurement -- it must hold on any machine, GPU or not.
      - name: Test suite (88 tests)
        working-directory: assignment7
        run: python -m pytest tests/ -q

      # The property Problem 5 asks for, shown directly.
      - name: Reverse-determinism demo
        working-directory: assignment7
        run: python experiments/demo_invert.py

      # Re-derives the invertibility gates from scratch: 100% of the 50,257
      # GPT-2 tokens, 256,000 random byte strings, multi-script UTF-8.
      # Exits non-zero if any gate fails.
      - name: E1 invertibility gates
        working-directory: assignment7
        run: python experiments/e1_invertibility.py

      # The number this whole project is about: the head's parameter count
      # must not move when |V| does.
      - name: Parameter audit
        working-directory: assignment7
        run: python experiments/params_audit.py

      # Belt and braces: assert the committed evidence a grader reads actually
      # says PASS, independently of the scripts that produced it.
      - name: Assert committed gates report PASS
        working-directory: assignment7
        run: python experiments/verify_gates.py

  session8-timeline:
    name: Session 8 - timeline integrity and date discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every date must carry a source link, the list must stay in
      # chronological order (the timeline's entire claim), and nothing may be
      # written up with fewer than three honest downsides.
      - name: Validate the mechanism dataset
        run: python assignment8/tools/validate.py

      # DATES.md is generated from data.js. If regenerating it produces a diff,
      # the README table and the live site have drifted apart.
      - name: DATES.md is in sync with data.js
        run: |
          python assignment8/tools/gen_date_table.py
          git diff --exit-code -- assignment8/DATES.md

  session9-loss-harness:
    name: Session 9 - loss harness correctness and write-up integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install torch (CPU)
        run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test deps
        run: pip install --quiet pytest

      # The chunked cross-entropy is only worth anything if it is bit-for-bit the same
      # objective as F.cross_entropy, gradients included, at every chunk size and with
      # masked targets. These tests lift the definitions straight out of the notebook
      # source, so they cannot pass against a stale copy.
      - name: Chunked cross-entropy and masking invariants
        working-directory: assignment9
        run: python -m pytest tests -q

      # loss_harness.py is the single source of truth; loss_harness.ipynb is generated
      # from it. If the notebook's code has drifted from the script, the thing a grader
      # opens is not the thing that was tested.
      - name: Notebook is in sync with the script
        working-directory: assignment9
        run: python tools/build_notebook.py --check

      # Every number in README.md is rendered from results/results.json, which the
      # notebook emits. If they disagree, the write-up is quoting a run that no longer
      # exists.
      - name: README numbers match the recorded run
        working-directory: assignment9
        run: python tools/render_numbers.py --check

      # An independent Colab GPU run of the same notebook. Quantities fixed by tensor
      # shapes, integer counts, CPU-seeded initialisation or plain arithmetic must come
      # out IDENTICAL on different hardware; only numbers downstream of GPU training may
      # drift. This fails if that split is ever violated, which would mean a real bug
      # rather than float noise.
      - name: Colab cross-run agrees where it must
        working-directory: assignment9
        run: python tools/compare_colab.py --check

  session10-truth-harness:
    name: Session 10 - instrumentation invariants and write-up integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install torch (CPU)
        run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test deps
        run: pip install --quiet pytest numpy

      # The claims that are arithmetic rather than measurement, and must therefore hold on
      # any machine: that token-weighted accumulation is EXACTLY the un-accumulated
      # gradient, that the average-of-averages is not, that the two coincide when the
      # micro-batch lengths are equal, and that the hand-written float encoder reproduces
      # the bits torch stores for fp32, bf16, fp16 and fp8 E4M3 -- including the three
      # patterns for 0.1 that the write-up quotes. These lift their definitions straight
      # out of truth_harness.py, so they cannot pass against a stale copy.
      - name: Accumulation and number-format invariants
        working-directory: assignment10
        run: python -m pytest tests -q

      # truth_harness.py is the single source of truth; truth_harness.ipynb is generated
      # from it. If the notebook's code has drifted from the script, the thing a grader
      # opens is not the thing that was tested.
      - name: Notebook is in sync with the script
        working-directory: assignment10
        run: python tools/build_notebook.py --check

      # Every number in README.md is rendered from results/results.json, which the
      # notebook emits. If they disagree, the write-up is quoting a run that no longer
      # exists.
      - name: README numbers match the recorded run
        working-directory: assignment10
        run: python tools/render_numbers.py --check

  session11-optimizer-harness:
    name: Session 11 - optimizer arithmetic and write-up integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install torch (CPU)
        run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test deps
        run: pip install --quiet pytest numpy

      # The claims that are arithmetic rather than measurement, and must therefore hold on
      # any machine: that the hand-written Adam reproduces torch's m, v and w; that turning
      # bias correction off multiplies every step by exactly sqrt(1-b2^t)/(1-b1^t) and that
      # the damage peaks at step 12 rather than step 1; that coupled L2 and decoupled AdamW
      # are different algorithms and both match torch; that the warmup/cosine/WSD schedules
      # hit their endpoints exactly; and that at the base width muP and SP are the same
      # model, which is section 5's control. These lift their definitions straight out of
      # optimizer_harness.py, so they cannot pass against a stale copy.
      - name: Optimizer, schedule and muP invariants
        working-directory: assignment11
        run: python -m pytest tests -q

      # optimizer_harness.py is the single source of truth; optimizer_harness.ipynb is
      # generated from it. If the notebook's code has drifted from the script, the thing a
      # grader opens is not the thing that was tested.
      - name: Notebook is in sync with the script
        working-directory: assignment11
        run: python tools/build_notebook.py --check

      # Every number in README.md is rendered from results/results.json, which the notebook
      # emits. If they disagree, the write-up is quoting a run that no longer exists.
      - name: README numbers match the recorded run
        working-directory: assignment11
        run: python tools/render_numbers.py --check

  session12-zero-harness:
    name: Session 12 - ZeRO simulator invariants and write-up integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install torch (CPU)
        run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test deps
        run: pip install --quiet pytest numpy

      # The claims that are arithmetic or structure rather than measurement, and must
      # therefore hold on any machine: that the memory ledger refuses an allocation it
      # cannot fit and keeps an honest high-water mark; that the ring all-reduce equals a
      # plain sum; that reduce-scatter leaves member i holding chunk i (the NCCL convention
      # every sharded stage assumes, and an off-by-one that still trains); that back-to-back
      # collectives do not corrupt each other's slots; that the measured per-rank volume is
      # 2*Psi*(N-1)/N rather than the 2*Psi everyone quotes; that the hierarchical all-reduce
      # computes the same sum over less InfiniBand; that a rank which OOMs does not hang the
      # other 31; that the ZeRO stage formulas reproduce the session's own 30B table; and
      # that a sharding bucket covers whole forward segments. These lift their definitions
      # straight out of zero_harness.py, so they cannot pass against a stale copy.
      - name: Simulator, collective and ZeRO invariants
        working-directory: assignment12
        run: python -m pytest tests -q

      # zero_harness.py is the single source of truth; zero_harness.ipynb is generated from
      # it. If the notebook's code has drifted from the script, the thing a grader opens is
      # not the thing that was tested.
      - name: Notebook is in sync with the script
        working-directory: assignment12
        run: python tools/build_notebook.py --check

      # Every number in README.md is rendered from results/results.json, which the notebook
      # emits. If they disagree, the write-up is quoting a run that no longer exists.
      - name: README numbers match the recorded run
        working-directory: assignment12
        run: python tools/render_numbers.py --check
